name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Repo validation gate (scripts/check)
        run: scripts/check
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
